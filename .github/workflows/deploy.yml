name: Deploy to Base Sepolia

# Trigger manually from GitHub Actions tab
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm'
        required: true
        default: ''

jobs:
  deploy:
    name: Deploy All Contracts
    runs-on: ubuntu-latest
    # Only run if user typed DEPLOY
    if: github.event.inputs.confirm == 'DEPLOY'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies
        run: forge install

      - name: Build contracts
        run: forge build

      - name: Deploy to Base Sepolia
        id: deploy
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
          TREASURY_ADDRESS: ${{ secrets.TREASURY_ADDRESS }}
        run: |
          # Use fallback public RPC if secret is empty
          RPC_URL="${BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}"
          echo "Using RPC URL: $RPC_URL"

          # Only verify if API key is provided
          VERIFY_FLAGS=""
          if [ -n "$BASESCAN_API_KEY" ]; then
            echo "BaseScan API Key detected. Verification enabled."
            VERIFY_FLAGS="--verify --etherscan-api-key $BASESCAN_API_KEY"
          else
            echo "No BaseScan API Key detected. Skipping verification."
          fi
          
          forge script script/DeployAll.s.sol:DeployAll \
            --rpc-url "$RPC_URL" \
            --broadcast \
            $VERIFY_FLAGS \
            -vvvv 2>&1 | tee deploy-output.txt

          echo "Deploy output saved to deploy-output.txt"

      - name: Extract deployed addresses
        run: |
          echo "=== DEPLOYED ADDRESSES ==="
          grep -E "\[(1|2|3|4|5|6|7)\]" deploy-output.txt || true
          echo ""
          echo "=== FOR addresses.ts ==="
          MAZE=$(grep "RatMaze" deploy-output.txt | grep -oP '0x[0-9a-fA-F]{40}' | tail -1)
          ITEMS=$(grep "GameItems" deploy-output.txt | grep -oP '0x[0-9a-fA-F]{40}' | tail -1)
          ENGINE=$(grep "CraftingEngine" deploy-output.txt | grep -oP '0x[0-9a-fA-F]{40}' | tail -1)
          VAULT=$(grep "BurrowVault" deploy-output.txt | grep -oP '0x[0-9a-fA-F]{40}' | tail -1)
          AMM=$(grep "ResourceAMM pool" deploy-output.txt | grep -oP '0x[0-9a-fA-F]{40}' | tail -1)

          echo "ratMaze:        \"$MAZE\""
          echo "gameItems:      \"$ITEMS\""
          echo "craftingEngine: \"$ENGINE\""
          echo "burrowVault:    \"$VAULT\""
          echo "resourceAMM:    \"$AMM\""

          # Write addresses file
          cat > addresses-output.ts <<EOF
          // Auto-generated by deploy.yml — Chain: Base Sepolia (84532)
          export const CONTRACT_ADDRESSES = {
            ratMaze:        "$MAZE"   as const,
            gameItems:      "$ITEMS"  as const,
            resourceAMM:    "$AMM"    as const,
            craftingEngine: "$ENGINE" as const,
            burrowVault:    "$VAULT"  as const,
            gameGovernor:   "0x0000000000000000000000000000000000000000" as const,
          };
          EOF
          cat addresses-output.ts

      - name: Upload deploy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-artifacts
          path: |
            deploy-output.txt
            addresses-output.ts
            broadcast/DeployAll.s.sol/84532/run-latest.json
