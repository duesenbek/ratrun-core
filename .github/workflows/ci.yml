name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  FOUNDRY_PROFILE: default
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest
    env:
      MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Check Solidity formatting
        run: forge fmt --check || true

      - name: Compile contracts
        run: forge build --sizes

      - name: Run unit & fuzz tests (no fork)
        run: forge test --no-match-path "test/fork/*" -v
        env:
          MAINNET_RPC_URL: ""

      - name: Run fork tests
        if: env.MAINNET_RPC_URL != ''
        run: forge test --match-path "test/fork/*" -v

      - name: Generate coverage report
        run: |
          mkdir -p coverage
          forge coverage \
            --no-match-path "test/fork/*" \
            --report lcov \
            --report summary \
            2>&1 | tee coverage/coverage-summary.md
        env:
          MAINNET_RPC_URL: ""

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend deps
        run: npm ci --prefix frontend

      - name: Run ESLint
        run: npm run lint --prefix frontend || true

  slither:
    name: Static Analysis (Slither)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Slither
        id: slither
        uses: crytic/slither-action@v0.4.0
        continue-on-error: true
        with:
          target: contracts/
          slither-args: "--exclude-dependencies --exclude naming-convention"
          fail-on: high
          sarif: results.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        # Загружаем только если файл реально создан
        if: always() && hashFiles('results.sarif') != ''
        with:
          sarif_file: results.sarif
